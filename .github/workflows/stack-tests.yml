name: Stack Tests

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  docker-stack-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run production-like stack tests
        run: bash scripts/run_stack_tests.sh
