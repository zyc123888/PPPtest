name: Stack Tests

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  docker-stack-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compose up
        run: docker compose up --build -d

      - name: Health check
        run: |
          for i in {1..40}; do
            if PPPTEST_RUN_MODE=docker bash scripts/health_check.sh >/tmp/test-platform-health.log 2>&1; then
              cat /tmp/test-platform-health.log
              exit 0
            fi
            sleep 5
          done
          cat /tmp/test-platform-health.log || true
          PPPTEST_RUN_MODE=docker bash scripts/health_check.sh

      - name: Backend pytest
        id: backend_pytest
        continue-on-error: true
        run: docker compose exec -T backend pytest -q --junitxml=/app/reports/pytest-stack.xml

      - name: Backend pytest verbose retry on failure
        if: steps.backend_pytest.outcome == 'failure'
        run: docker compose exec -T backend pytest -vv --maxfail=1 || true

      - name: Upload backend pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-pytest-report
          path: backend/reports/pytest-stack.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Fail job when backend pytest failed
        if: steps.backend_pytest.outcome == 'failure'
        run: exit 1

      - name: Build e2e image
        run: docker compose build e2e

      - name: Run e2e specs
        run: >
          docker compose run --rm e2e npx playwright test
          tests/admin_layout.spec.js
          tests/full_flow.spec.js
          tests/workspace_membership_flow.spec.js
          tests/workspace_owner_guard.spec.js
          tests/execution_artifact_download.spec.js
          --reporter=line

      - name: Dump stack diagnostics on failure
        if: failure()
        run: |
          docker ps -a || true
          docker compose logs backend --tail=200 || true
          docker compose logs frontend --tail=200 || true
          docker compose logs worker --tail=200 || true
          docker compose logs mariadb --tail=200 || true

      - name: Compose down
        if: always()
        run: docker compose down -v
