services:
  mysql:
    image: mariadb:11.4
    container_name: ppptest-mysql
    environment:
      MARIADB_DATABASE: "${MARIADB_DATABASE}"
      MARIADB_USER: "${MARIADB_USER}"
      MARIADB_PASSWORD: "${MARIADB_PASSWORD}"
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD}"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u$${MARIADB_USER} -p$${MARIADB_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - ppptest-network

  redis:
    image: redis:7-alpine
    container_name: ppptest-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 64M
    networks:
      - ppptest-network

  backend:
    build:
      context: ./backend
      target: runtime
    container_name: ppptest-backend
    environment:
      APP_ENV: docker
      DATABASE_URL: "${DOCKER_DATABASE_URL}"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      BACKEND_INTERNAL_URL: http://backend:8000
      FRONTEND_INTERNAL_URL: http://frontend:3000
      BACKEND_PUBLIC_URL: http://127.0.0.1:8000
      FRONTEND_PUBLIC_URL: http://127.0.0.1:3000
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      APP_ENCRYPTION_KEY: "${APP_ENCRYPTION_KEY}"
      INITIAL_ADMIN_PASSWORD: "${INITIAL_ADMIN_PASSWORD}"
      SEED_DEMO_DATA_ON_BOOTSTRAP: "${SEED_DEMO_DATA_ON_BOOTSTRAP:-false}"
      CASE_GENERATION_RULES_DIR: claw_5skill_final
      CASE_GENERATION_UNIFIED_RULES_DIR: claw_5skill_unified
      UI_CASE_SKILL_DIR: ui_case_skills
      CASE_GEN_MAX_CONCURRENCY: "4"
      CASE_GEN_WATCHDOG_ENABLED: "true"
      CASE_GEN_REQUIREMENT_MAX_TOKENS: "8000"
      CASE_GEN_REQUIREMENT_BATCH_CONCURRENCY: "2"
      CASE_GEN_TESTCASE_REPAIR_MAX_ROUNDS: "1"
      CASE_GEN_TRUSTED_SHARD_CONCURRENCY: "2"
      CASE_GEN_SCOPE_INDEX_CONCURRENCY: "2"
      CASE_GEN_SCOPE_INDEX_TWO_PHASE_TRIGGER_SECTIONS: "16"
      CASE_GEN_SCOPE_INDEX_TWO_PHASE_TRIGGER_TEXT: "48000"
      CASE_GEN_TRUSTED_MODEL_GATE_ENABLED: "false"
      CASE_GEN_TRUSTED_SHARD_MAX_ATTEMPTS: "2"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend/reports:/app/reports
      - ./backend/app:/app/app
      - ./backend/claw_5skill_final:/app/claw_5skill_final
      - ./backend/claw_5skill_unified:/app/claw_5skill_unified
      - ./backend/ui_case_skills:/app/ui_case_skills
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/v1/system/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.8'
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - ppptest-network

  worker:
    build:
      context: ./backend
      target: execution
    container_name: ppptest-worker
    command: sh -c 'umask 0002 && exec celery -A app.core.celery_app.celery_app worker -l info --pool=solo -Q execution,celery -n execution@%h'
    environment:
      APP_ENV: docker
      DATABASE_URL: "${DOCKER_DATABASE_URL}"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      BACKEND_INTERNAL_URL: http://backend:8000
      FRONTEND_INTERNAL_URL: http://frontend:3000
      BACKEND_PUBLIC_URL: http://127.0.0.1:8000
      FRONTEND_PUBLIC_URL: http://127.0.0.1:3000
      APP_ENCRYPTION_KEY: "${APP_ENCRYPTION_KEY}"
      CASE_GENERATION_RULES_DIR: claw_5skill_final
      CASE_GENERATION_UNIFIED_RULES_DIR: claw_5skill_unified
      CASE_GEN_MAX_CONCURRENCY: "4"
      CASE_GEN_REQUIREMENT_MAX_TOKENS: "8000"
      CASE_GEN_REQUIREMENT_BATCH_CONCURRENCY: "2"
      CASE_GEN_TESTCASE_REPAIR_MAX_ROUNDS: "1"
      CASE_GEN_TRUSTED_SHARD_CONCURRENCY: "2"
      CASE_GEN_SCOPE_INDEX_CONCURRENCY: "2"
      CASE_GEN_SCOPE_INDEX_TWO_PHASE_TRIGGER_SECTIONS: "16"
      CASE_GEN_SCOPE_INDEX_TWO_PHASE_TRIGGER_TEXT: "48000"
      CASE_GEN_TRUSTED_MODEL_GATE_ENABLED: "false"
      CASE_GEN_TRUSTED_SHARD_MAX_ATTEMPTS: "2"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./backend/reports:/app/reports
      - ./backend/app:/app/app
      - ./backend/claw_5skill_final:/app/claw_5skill_final
      - ./backend/claw_5skill_unified:/app/claw_5skill_unified
    restart: unless-stopped
    shm_size: 256M
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - ppptest-network

  case-worker:
    build:
      context: ./backend
      target: runtime
    container_name: ppptest-case-worker
    command: sh -c 'umask 0002 && exec celery -A app.core.celery_app.celery_app worker -l info --pool=prefork --concurrency=1 -Q case_generation -n case-generation@%h'
    environment:
      APP_ENV: docker
      DATABASE_URL: "${DOCKER_DATABASE_URL}"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      BACKEND_INTERNAL_URL: http://backend:8000
      FRONTEND_INTERNAL_URL: http://frontend:3000
      BACKEND_PUBLIC_URL: http://127.0.0.1:8000
      FRONTEND_PUBLIC_URL: http://127.0.0.1:3000
      APP_ENCRYPTION_KEY: "${APP_ENCRYPTION_KEY}"
      CASE_GENERATION_RULES_DIR: claw_5skill_final
      CASE_GENERATION_UNIFIED_RULES_DIR: claw_5skill_unified
      CASE_GEN_REQUIREMENT_MAX_TOKENS: "8000"
      CASE_GEN_REQUIREMENT_BATCH_CONCURRENCY: "2"
      CASE_GEN_TESTCASE_REPAIR_MAX_ROUNDS: "1"
      CASE_GEN_TRUSTED_SHARD_CONCURRENCY: "2"
      CASE_GEN_SCOPE_INDEX_CONCURRENCY: "2"
      CASE_GEN_SCOPE_INDEX_TWO_PHASE_TRIGGER_SECTIONS: "16"
      CASE_GEN_SCOPE_INDEX_TWO_PHASE_TRIGGER_TEXT: "48000"
      CASE_GEN_TRUSTED_MODEL_GATE_ENABLED: "false"
      CASE_GEN_TRUSTED_SHARD_MAX_ATTEMPTS: "2"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./backend/reports:/app/reports
      - ./backend/app:/app/app
      - ./backend/claw_5skill_final:/app/claw_5skill_final
      - ./backend/claw_5skill_unified:/app/claw_5skill_unified
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.8'
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - ppptest-network

  frontend:
    build:
      context: ./frontend
    container_name: ppptest-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "2m"
        max-file: "2"
    networks:
      - ppptest-network

  e2e:
    build:
      context: ./e2e
    container_name: ppptest-e2e
    environment:
      E2E_BASE_URL: http://frontend:3000
      E2E_ADMIN_USER: "${E2E_ADMIN_USER:-admin}"
      E2E_ADMIN_PASSWORD: "${E2E_ADMIN_PASSWORD}"
    depends_on:
      frontend:
        condition: service_healthy
    volumes:
      - ./e2e/reports:/e2e/reports
    profiles:
      - test
    networks:
      - ppptest-network

volumes:
  mysql_data:
    driver: local

networks:
  ppptest-network:
    driver: bridge
