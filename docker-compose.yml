services:
  mysql:
    image: mysql:8.0
    container_name: test-platform-mysql
    environment:
      MYSQL_DATABASE: test_platform
      MYSQL_USER: tester
      MYSQL_PASSWORD: tester123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3306:3306"
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: test-platform-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: test-platform-backend
    environment:
      DATABASE_URL: mysql+pymysql://tester:tester123@mysql:3306/test_platform
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      BACKEND_INTERNAL_URL: http://backend:8000
      FRONTEND_INTERNAL_URL: http://frontend:3000
      PYTHONPATH: /app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/v1/system/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: ./backend
    container_name: test-platform-worker
    command: celery -A app.core.celery_app.celery_app worker -l info --pool=solo
    environment:
      DATABASE_URL: mysql+pymysql://tester:tester123@mysql:3306/test_platform
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      BACKEND_INTERNAL_URL: http://backend:8000
      FRONTEND_INTERNAL_URL: http://frontend:3000
      PYTHONPATH: /app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    container_name: test-platform-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20

  e2e:
    build:
      context: ./e2e
    container_name: test-platform-e2e
    environment:
      E2E_BASE_URL: http://frontend:3000
    depends_on:
      frontend:
        condition: service_healthy
    profiles:
      - test

volumes:
  mysql_data:
